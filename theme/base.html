<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{og_image}}">
<link rel="icon" href="{{base}}/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="{{base}}/assets/fonts/jbm-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{base}}/assets/style.css?v={{version}}">
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">skip to content</a>
<header class="top">
  <a class="brand" href="{{base}}/">{{site_name}}</a>
  <nav class="nav" aria-label="main">{{nav}}</nav>
</header>
<main id="main">
{{content}}
</main>
<footer class="bottom">
  <span>© {{year}} Martin Guevara-Kunerth</span>
  <span class="dim">No cookies, no tracking.</span>
  <nav aria-label="legal">{{footer_nav}}</nav>
</footer>
<script src="{{base}}/assets/main.js?v={{version}}" defer></script>
</body>
</html>
