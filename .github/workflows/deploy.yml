# Builds the site from projects/ + pages/ and publishes it to GitHub Pages
# every time something is pushed to the main branch.
#
# One-time setup on github.com:
#   repo -> Settings -> Pages -> "Build and deployment" -> Source: GitHub Actions
name: build & deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cache processed images
        uses: actions/cache@v4
        with:
          path: .cache
          key: images-${{ hashFiles('projects/**') }}
          restore-keys: images-
      - run: pip install pillow
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
